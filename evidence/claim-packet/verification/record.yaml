statement_comparison:
  statement_id: "STMT-jsp-000301-v1"
  theorem_name: "JSP000301.original_claim_is_false"
  result: equivalent
  basis: >-
    The catalogued question is a yes/no question: "If two consecutive positive integers are
    powerful, must at least one be a perfect square?" Its negation is
    `~(forall n : Nat, 0 < n -> Powerful n -> Powerful (n+1) -> IsSquare n \/ IsSquare (n+1))`,
    which is exactly `JSP000301.original_claim_is_false`; the companion theorem
    `JSP000301.consecutive_powerful_neither_square` exhibits the witness n = 12167.
    All premises and the quantifier structure are preserved: the implication antecedents
    (0 < n, Powerful n, Powerful (n+1)) and the disjunctive conclusion are formalised
    literally, definitions of Powerful and IsSquare follow the catalogued wording, and the
    witness matches the recorded solution (12167 = 23^3, 12168 = 2^3 * 3^2 * 13^2, neither a
    square since 110^2 = 12100 < 12167 < 12168 < 12321 = 111^2). No premise was dropped and
    no definition was weakened (`isPrime_standard` proves the computability-friendly prime
    predicate equals the textbook one).
  performed_by: "1athena"
  performed_at: "2026-09-19"
