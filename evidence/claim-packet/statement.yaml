id: STMT-jsp-000301-v1
status: active
supersedes: null
statement:
  text: >-
    JSP-000301 (Erdős problem on consecutive powerful numbers). Catalogued question:
    "If two consecutive positive integers are powerful, must at least one be a perfect
    square?" The formal statement formalises the exact negation of that question, which is
    the recorded complete resolution (disproof by the witness n = 12167 = 23^3, with
    12168 = 2^3 * 3^2 * 13^2). Definitions: Powerful n := every prime divisor p of n
    satisfies p * p | n; IsSquare n := exists k : Nat, k * k = n; IsPrime p is a computable
    Bool predicate proved equivalent (theorem isPrime_standard) to the textbook definition
    (2 <= p and no divisor d with 2 <= d < p). Formal theorems:
    (1) JSP000301.consecutive_powerful_neither_square :
        exists n : Nat, 0 < n /\ Powerful n /\ Powerful (n + 1) /\ ~IsSquare n /\ ~IsSquare (n + 1);
    (2) JSP000301.original_claim_is_false :
        ~ (forall n : Nat, 0 < n -> Powerful n -> Powerful (n + 1) -> IsSquare n \/ IsSquare (n + 1)).
  natural_language_source: >-
    TheJustinSunPrize/awards problem bank, record JSP-000301, file problems/catalog-0301-0400.md
    (status "Solved (disproved)": 12167 = 23^3 and 12168 = 2^3 * 3^2 * 13^2 are consecutive
    powerful numbers and neither is a perfect square; both lie strictly between 110^2 = 12100
    and 111^2 = 12321). Upstream origin: Erdős problem #365 (erdosproblems.com).
  definitions_reviewed:
    - name: IsPrime
      from_library: false
      review: >-
        Defined in the proof file as `IsPrime p := isPrimeB p = true` with `isPrimeB` a
        computable Bool predicate. Not taken from any library. Equivalence with the textbook
        definition (2 <= p and no d with 2 <= d < p dividing p) is PROVED in the file
        (theorem isPrime_standard), so no definition was weakened.
    - name: Powerful
      from_library: false
      review: >-
        Defined in the proof file as: for every p, IsPrime p -> p | n -> p * p | n. This is the
        standard definition of a powerful number (every prime factor has exponent at least two)
        and matches the catalogued wording verbatim.
    - name: IsSquare
      from_library: false
      review: >-
        Defined in the proof file as `exists k : Nat, k * k = n`, the standard notion of a
        perfect square over the natural numbers.
